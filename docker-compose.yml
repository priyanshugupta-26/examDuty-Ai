version: '3.8'

services:
  # ==========================================
  # FastAPI Backend (CP-SAT Solver & Agent)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: examduty-backend:latest
    container_name: examduty-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./examduty.db
      - SECRET_KEY=examduty-super-secret-key-vfstr-agentic-2026-secure
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend-storage:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Next.js Frontend (Tailwind & App Router)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    image: examduty-frontend:latest
    container_name: examduty-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-storage:
    driver: local
